<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard CFO deplace vers le Cockpit</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="3; url=https://hub.ramalogic.com/cockpit/">
  <link rel="canonical" href="https://hub.ramalogic.com/cockpit/">
  <style>
    :root { --cream:#F5F1E6; --ink:#1f2a24; --aloe:#3f5c4e; --mindaro:#DFE971; --slate:#6b7a72; }
    * { box-sizing:border-box; }
    html,body { height:100%; margin:0; }
    body {
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
      background:var(--cream); color:var(--ink);
      display:flex; align-items:center; justify-content:center; padding:24px;
    }
    .card {
      max-width:520px; text-align:center; background:#fff; border:1px solid #e6e1d2;
      border-radius:16px; padding:40px 32px; box-shadow:0 8px 30px rgba(31,42,36,.06);
    }
    .dot { width:44px; height:44px; border-radius:12px; background:var(--aloe);
      display:inline-flex; align-items:center; justify-content:center; margin-bottom:18px; }
    .dot span { width:14px; height:14px; border-radius:4px; background:var(--mindaro); }
    h1 { font-size:20px; margin:0 0 10px; letter-spacing:-.01em; }
    p { color:var(--slate); line-height:1.55; margin:0 0 22px; font-size:15px; }
    a.btn {
      display:inline-block; background:var(--aloe); color:#fff; text-decoration:none;
      font-weight:600; padding:12px 22px; border-radius:10px; font-size:15px;
    }
    a.btn:hover { background:#35503f; }
    .small { margin-top:18px; font-size:12.5px; color:var(--slate); }
    .small a { color:var(--aloe); }
  </style>
</head>
<body>
  <main class="card">
    <div class="dot"><span></span></div>
    <h1>Le dashboard CFO a demenage</h1>
    <p>Il est desormais integre au <strong>Cockpit "Chaine de valeur"</strong> :
       treso, runway, CA vs objectif, OKR, OPEX et TVA, plus le funnel d'acquisition
       et le goulot de la semaine, au meme endroit.</p>
    <a class="btn" href="https://hub.ramalogic.com/cockpit/">Ouvrir le Cockpit &rarr;</a>
    <div class="small">Redirection automatique dans 3 s. Si rien ne se passe,
      <a href="https://hub.ramalogic.com/cockpit/">clique ici</a>.</div>
  </main>
  <script>setTimeout(function(){ location.replace("https://hub.ramalogic.com/cockpit/"); }, 3000);</script>
</body>
</html>
